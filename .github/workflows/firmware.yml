name: Firmware
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run control tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/control_test.cpp -o /tmp/control_test && /tmp/control_test
      - name: Compile and run battery/protection tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/energy_test.cpp -o /tmp/energy_test && /tmp/energy_test
      - name: Adversarial control and protection property tests (UBSan)
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Iinclude tests/adversarial_test.cpp -o /tmp/adversarial_test && /tmp/adversarial_test
      - name: Check repository, embedded dashboard and license
        run: python3 tests/repo_smoke.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Build ESP8266 firmware
        run: pio run -e d1_mini
      - name: Rename firmware
        run: cp .pio/build/d1_mini/firmware.bin quad-controller-d1-mini.bin
      - uses: actions/upload-artifact@v4
        with:
          name: quad-controller-d1-mini
          path: quad-controller-d1-mini.bin
          if-no-files-found: error
          retention-days: 30
